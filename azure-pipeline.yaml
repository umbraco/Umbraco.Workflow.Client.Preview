trigger:
  branches:
    include:
    - main
pr: none

resources:
  repositories:
  - repository: build
    type: github
    name: Umbraco/Umbraco.Build
    endpoint: umbraco

parameters:
  - name: sbom_generate
    displayName: Generate SBOM
    type: boolean
    default: false

variables:
  - name: productName
    value: 'Umbraco.Workflow.Client.Preview'

stages:
  - stage: GenerateSBOM
    displayName: Generate SBOM
    dependsOn: []
    condition: or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{ parameters.sbom_generate }}', 'true'))
    jobs:
    - job: GenerateSBOM
      displayName: Generate SBOM
      steps:
      - template: devops/templates/generate-sbom-template.yml@build
        parameters:
          sbom_nuget: false
          sbom_npm_paths: ['.']
          sbom_version_from: package.json # v<major> of package.json, e.g. 17.0.0-beta.2 -> v17
          # a run forced with sbom_generate must not displace the latest version in Dependency-Track
          ${{ if eq(parameters.sbom_generate, true) }}:
            sbom_is_latest: 'false'